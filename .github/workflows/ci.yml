name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            src/requirements.txt
            src/requirements-dev.txt
      - run: pip install -r src/requirements.txt -r src/requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # pytest exits 5 when there is nothing to collect: skip only until the first tests land.
      - if: hashFiles('src/tests/test_*.py') != ''
        run: pytest
